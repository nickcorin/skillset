[package]
name = "skillset"
version = "0.1.0"
edition = "2024"
authors = ["Nick Corin"]
description = "Vendor agent skills from GitHub at pinned commits into a folder you choose."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nickcorin/skillset"

[dependencies]
clap = { version = "4.6.10", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
